# ========================
#      CONFIG VERSION
# ========================
config_version: 2.0.0

# ========================
#        RARITIES
# ========================
rarities:
  COMMON:
    weight: 50 #Chance of getting from a ce book
    display_color: "{gray}"
    enabled: true

  UNCOMMON:
    weight: 25
    display_color: "{green}"
    enabled: true

  RARE:
    weight: 15
    display_color: "{blue}"
    enabled: true

  EPIC:
    weight: 10
    display_color: "{light_purple}"
    enabled: true

  LEGENDARY:
    weight: 5
    display_color: "{gold}"
    enabled: true

  MASTERY:
    weight: 3
    display_color: "{red}"
    enabled: true

  HEROIC:
    weight: 0
    display_color: "{dark_red}"
    enabled: true
# ========================
#     ENCHANTMENT BOOKS
# ========================
# When true, every enchantment book has a SUCCESS rate. If applying it fails, there is a
# destroy_chance % chance the item is destroyed (50 = a 50/50 coin flip). Otherwise, the item is
# simply kept. An item with a White/Holy Scroll is never destroyed: the scroll is used up instead.
# Turning this off also turns off Magic Dust (it only works on books that have these rates).
book_chance: true

enchant_books:
  success_min: 30      # a new book rolls its success rate between these two numbers
  success_max: 100
  destroy_chance: 50   # % chance a FAILED book destroys the item

# ========================
#       BLACK SCROLL
# ========================
black_scroll:
  remove_enchantments: true  # false = Black Scrolls refuse to remove anything

# ========================
#         MESSAGES
# ========================
messages:
  invalid_enchantment: "{red}That enchantment is unavailable."
  item_null: "{red}Hold an item first."
  level_exceeds_max: "{red}That level exceeds the maximum of {max_level}."
  cannot_apply: "{red}That enchantment cannot be applied to this item."
  enchant_applied: "{green}Applied {enchant_name:{key}} {level} to your item."
  enchant_removed: "{green}Removed {enchant_name:{key}} from your item."
  tool_repaired: "{green}Your tool has been repaired!"
  book_max_level: "{red}This enchantment is already at its maximum level."
  book_combine_mismatch: "{red}You can only combine books with the same enchantment and level."
  durable_items_only: "{red}You can only enchant durable items."
  item_has_equal_or_higher: "{red}This item already has that enchantment at an equal or higher level."
  item_enchant_max_level: "{red}This enchantment is already at its maximum level on this item."
  no_enchants_for_rarity: "{red}No enabled enchantments are available for this rarity."
  books_created: "{green}Created {amount} enchantment books!"
  inventory_full_books: "{red}Your inventory is full; {amount} book(s) were dropped."
  black_scroll_durable_only: "{red}Only durable items can be modified with a Black Scroll."
  black_scroll_no_enchants: "{red}That item has no enchantments to remove."
  black_scroll_success: "{green}Successfully removed an enchantment!"
  black_scroll_failure: "{red}Failed to remove an enchantment."
  white_scroll_durable_only: "{red}That item must be durable."
  white_scroll_protected: "{red}That item is already protected."
  book_failed_holy_protected: "{gold}The enchantment failed, but your Holy protection saved the item!"
  item_processing_error: "{red}An error occurred while processing that item."
  black_scroll_disabled: "{red}Black Scrolls can't remove enchantments right now."
  book_failed_kept: "{yellow}The enchantment failed, but your item survived."
  book_failed_protected: "{gold}The enchantment failed, but your protection scroll saved the item!"
  book_failed_destroyed: "{red}The enchantment failed and your item was destroyed!"
  dust_opened: "{green}The Magic Dust revealed: {dust_name}{green}!"
  dusts_opened: "{green}Revealed {amount} dusts!"
  inventory_full_dust: "{red}Your inventory is full; {amount} dust(s) were dropped."
  dust_books_only: "{red}Dust can only be combined with an enchantment book."
  dust_maxed: "{red}This book can't be improved any further with that dust."
