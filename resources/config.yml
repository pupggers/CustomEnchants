  invalid_enchantment: "{red}That enchantment is unavailable."
  item_null: "{red}Hold an item first."
  level_exceeds_max: "{red}That level exceeds the maximum of {max_level}."
  cannot_apply: "{red}That enchantment cannot be applied to this item."
