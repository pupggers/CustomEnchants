# =======================
#      SETTINGS
# =======================
enchant_lore:
  header: "{reset}{light_purple}Enchantments: "  # The header line
  entry_format: "{reset} {dark_gray}» {reset}{color}{name} {level}"  # Format for each enchant
  sort_by_rarity: true  # Whether to sort enchants by rarity
  roman_numerals: true # Whether to enable roman numerals as level showcase