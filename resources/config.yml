# ========================
#      CONFIG VERSION
# ========================
config_version: 2.0.0

# ========================
#        RARITIES
# ========================
# Add display_name to a tier to rename it. Rarities added by addons can be overridden here by name too.
rarities:
  COMMON:
    weight: 50 #Chance of getting from a ce book
    display_color: "{gray}"
    enabled: true

  UNCOMMON:
    weight: 25
    display_color: "{green}"
    enabled: true

  RARE:
    weight: 15
    display_color: "{blue}"
    enabled: true

  EPIC:
    weight: 10
    display_color: "{light_purple}"
    enabled: true

  LEGENDARY:
    weight: 5
    display_color: "{gold}"
    enabled: true

  MASTERY:
    weight: 3
    display_color: "{red}"
    enabled: true

  HEROIC:
    weight: 0
    display_color: "{dark_red}"
    enabled: true
# ========================
#         CHANCES
# ========================
# Proc chance (%) at an enchant's max level. Level 1 uses the enchant's own `chance`; levels in between scale evenly.
# Override per enchant with `max_chance` in enchantments.json.
max_level_chance: 70

# ========================
#        ENCHANTER
# ========================
# /ce opens the shop. Prices are "level:<levels>" or "exp:<points>"; set one to false to stop selling it.
# Rarities not listed here (including ones addons add, like SOUL or FABLED) use "default".
shop:
  title: "{dark_purple}Enchanter"
  books:
    COMMON: "level:5"
    UNCOMMON: "level:10"
    RARE: "level:15"
    EPIC: "level:25"
    LEGENDARY: "level:35"
    MASTERY: false
    HEROIC: false
    default: "level:50"
  items:
    white_scroll: "level:30"
    holy_scroll: "level:60"
    black_scroll: "level:20"

# ========================
#        TINKERER
# ========================
# Magic Dust per enchantment book, by rarity. Unlisted rarities use default_dust; 0 refuses the book.
tinkerer:
  title: "{gold}Tinkerer"
  default_dust: 1
  dust:
    COMMON: 1
    UNCOMMON: 1
    RARE: 2
    EPIC: 2
    LEGENDARY: 3
    MASTERY: 4
    HEROIC: 5

# ========================
#         ADDONS
# ========================
# Addons run as code on your server: only list repositories you trust.
addons:
  repositories: {}  # name: "owner/repo"
  allow_any_repository: true

# ========================
#     ENCHANTMENT BOOKS
# ========================
# When true, every enchantment book has a SUCCESS rate and a DESTROY rate that add up to 100
# (a 70% book has a 30% destroy rate). If applying fails, the destroy rate is the chance the item is
# destroyed; otherwise it is kept. An item with a White/Holy Scroll is never destroyed: the scroll is used up.
# Magic Dust raises success, which lowers destroy by the same amount.
# Turning this off also turns off Magic Dust (it only works on books that have these rates).
book_chance: true

enchant_books:
  success_min: 30      # a new book rolls its success rate between these two numbers
  success_max: 100
  # Level a rarity book gives when opened: random (1 to the enchant's max level), a number, or a range
  # like "2-4" (capped at the enchant's max). Rarities not listed use "default".
  levels:
    COMMON: random
    UNCOMMON: random
    RARE: random
    EPIC: random
    LEGENDARY: random
    default: 1

  item_type_names:
    block_tools: "Tools"

# ========================
#       BLACK SCROLL
# ========================
black_scroll:
  remove_enchantments: true  # false = Black Scrolls refuse to remove anything

# ========================
#         MESSAGES
# ========================
# Every message goes through PlaceholderAPI: colors ({red}, {bold}...), {player}, {player_health}, {server_online},
# {enchant_name:<key>}, {roman:<number>}, and placeholders addons. Set a message to "" to turn it off.
# Addon messages can be overridden here too, or in that addon's own config.yml.
