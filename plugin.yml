name: CustomEnchants
main: pup\customenchants\Main
author: pup
api: 5.0.0
version: 2.0.0

permissions:
  enchant.command:
    default: true
    description: Open the Enchanter shop with /ce
  enchant.command.tinkerer:
    default: true
    description: Trade enchantment books for Magic Dust
  enchant.command.add:
    default: op
    description: Add an enchant to an item
  enchant.command.remove:
    default: op
    description: Remove an enchant from an item
  enchant.command.addon:
    default: op
    description: Install, list or remove enchant addons (downloads code from GitHub)
